services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: osos-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Osos_Str0ng!Pass}"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: osos-app
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__Default: "Server=mssql,1433;Database=OsosSuite;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Osos_Str0ng!Pass};TrustServerCertificate=true;Connect Timeout=60"
      Jwt__Key: "${JWT_KEY:-CHANGE_ME_docker_super_secret_key_min_32_characters_1234567890}"
    ports:
      - "8080:8080"
    depends_on:
      mssql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mssql-data:
