# Üretim override: portları yalnızca localhost'a bağla (public'e açma).
# Erişim Tailscale üzerinden sağlanır (tailscale serve). Kullanım:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  mssql:
    restart: always
    ports: !override
      # DB_BIND=<tailscale-ip> verilirse DB o IP'de (sadece tailnet) dinler → SSMS ile uzaktan erişim.
      # Verilmezse yalnızca localhost (güvenli varsayılan).
      - "${DB_BIND:-127.0.0.1}:1433:1433"

  app:
    restart: always
    ports: !override
      - "127.0.0.1:8090:8080"   # host 8090 (8080 sunucuda başka container tarafından kullanılıyor)
